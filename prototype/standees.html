<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaders — plateau en perspective</title>
<style>
  :root{
    --tilt: 52deg;
    --bone:#efe7d6;
    --gold:#c9a227;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:radial-gradient(ellipse at 50% 18%, #2c3340, #171a20 70%);
    font-family:ui-sans-serif,system-ui,sans-serif; color:#e8e3d9;
    padding:28px 16px;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
  h1{font-size:14px;letter-spacing:.22em;text-transform:uppercase;opacity:.5;font-weight:600;margin:0}
  .hint{font-size:13px;opacity:.5;margin:0;text-align:center;max-width:50ch;line-height:1.55}

  .scene{ perspective: 1500px; perspective-origin: 50% 42%; }

  .board{
    position:relative; width:var(--bw); height:var(--bh);
    transform: rotateX(var(--tilt));
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.4,0,.2,1);
  }
  body.flat .board{ transform: rotateX(0deg); }
  body.flat .fig{ transform: rotateX(0deg) scale(.82) !important; }

  /* Le plateau : hexagone régulier à sommets gauche et droite, dimensionné en JS
     sur l'étendue réelle des cases pour que le rapport largeur/hauteur reste
     exactement 2/√3 — sinon les sommets du plateau ne tombent plus sur les
     cases d'angle. */
  .slab{
    position:absolute; left:50%; top:50%;
    width:var(--slabw); height:var(--slabh);
    margin-left:calc(var(--slabw) / -2); margin-top:calc(var(--slabh) / -2);
    background:radial-gradient(ellipse at 38% 28%, #fdfaf3 0%, var(--bone) 45%, #ded2b8 100%);
    clip-path:polygon(100% 50%,75% 93.3%,25% 93.3%,0 50%,25% 6.7%,75% 6.7%);
    box-shadow: 0 40px 70px -18px rgba(0,0,0,.8);
  }
  .slab::after{
    content:""; position:absolute; inset:14px;
    clip-path:polygon(100% 50%,75% 93.3%,25% 93.3%,0 50%,25% 6.7%,75% 6.7%);
    border:1px solid rgba(120,100,60,.26);
    background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(170,145,100,.07));
  }

  .cell{
    position:absolute; width:var(--cs); height:var(--cs); margin:calc(var(--cs)/-2);
    border-radius:50%; transform-style:preserve-3d;
  }
  .disc{
    position:absolute; inset:0; border-radius:50%; cursor:pointer;
    background:radial-gradient(circle at 42% 36%, rgba(255,255,255,.55), rgba(190,172,136,.16) 70%, rgba(150,130,95,.24));
    box-shadow: inset 0 2px 4px rgba(120,100,70,.28), inset 0 -1px 2px rgba(255,255,255,.5);
    border:1px solid rgba(140,118,78,.28);
  }
  .cell.recruit .disc{
    border:1.5px solid var(--gold);
    box-shadow: inset 0 0 0 3px rgba(201,162,39,.15), inset 0 2px 5px rgba(120,100,70,.28);
  }
  .cell.crown .disc{
    border:2px solid var(--gold);
    background:radial-gradient(circle at 42% 36%, #fff8e2, #e8d6a4 70%, #d4bd82);
  }
  .cell.crown .disc::after{
    content:"\2655"; position:absolute; inset:0; display:grid; place-items:center;
    color:rgba(140,112,30,.6); font-size:calc(var(--cs)*.4);
  }
  .cell.lit .disc{
    background:radial-gradient(circle at 42% 36%, #d9f1d3, #9cd49a 75%);
    border-color:#5fa75d;
    box-shadow: inset 0 0 0 3px rgba(95,167,93,.3), 0 0 14px rgba(120,210,120,.45);
  }

  .piece{
    position:absolute; width:var(--cs); height:var(--cs); margin:calc(var(--cs)/-2);
    transform-style:preserve-3d; pointer-events:none;
    transition: left .45s cubic-bezier(.34,1.26,.5,1), top .45s cubic-bezier(.34,1.26,.5,1);
  }
  /* Ombre et socle restent à plat dans le plan du plateau. */
  .shadow{
    position:absolute; left:7%; top:18%; width:86%; height:64%;
    border-radius:50%; background:rgba(60,45,25,.4); filter:blur(5px);
  }
  .socle{
    position:absolute; left:5%; top:16%; width:90%; height:68%;
    border-radius:50%;
    background:linear-gradient(160deg,#f4e3b8,#d9bf86 55%,#bda268);
    border:1px solid rgba(120,95,45,.45);
    box-shadow:0 2px 0 #a98d55, 0 3px 6px rgba(0,0,0,.28);
  }
  .socle.p1{
    background:linear-gradient(160deg,#f6d9d9,#d99a9a 55%,#bd7676);
    border-color:rgba(130,60,60,.5); box-shadow:0 2px 0 #a86060,0 3px 6px rgba(0,0,0,.28);
  }
  /* La silhouette se redresse par contre-rotation exacte de l'inclinaison. */
  .fig{
    position:absolute; left:50%; bottom:42%;
    width:calc(var(--cs)*1.32); height:calc(var(--cs)*1.95);
    margin-left:calc(var(--cs)*-.66);
    transform: rotateX(calc(var(--tilt) * -1));
    transform-origin:50% 100%;
    transition: transform .6s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.35));
  }
  .fig svg{width:100%;height:100%;display:block;overflow:visible}

  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{
    background:rgba(255,255,255,.07); color:#e8e3d9; border:1px solid rgba(255,255,255,.18);
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  button:hover{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Leaders &mdash; prototype de rendu</h1>
  <div class="scene"><div class="board" id="board"><div class="slab"></div></div></div>
  <p class="hint">Clique une case verte pour d&eacute;placer la figurine active, puis la suivante prend la main. Ce qui se teste ici, c'est le rendu standee et la lisibilit&eacute; en perspective &mdash; pas la qualit&eacute; du dessin, volontairement sch&eacute;matique.</p>
  <div class="controls">
    <button id="bFlat">Perspective / &agrave; plat</button>
    <button data-tilt="38">Inclinaison douce</button>
    <button data-tilt="52">Standard</button>
    <button data-tilt="64">Forte</button>
  </div>
</div>

<script type="module">
const R = 3, SIZE = 46, CS = 56;
const SQ3 = Math.sqrt(3);

// Grille axiale, identique a engine/board.ts
const CELLS = [];
for (let q = -R; q <= R; q++) {
  const rMin = Math.max(-R, -q - R), rMax = Math.min(R, -q + R);
  for (let r = rMin; r <= rMax; r++) CELLS.push({ q, r });
}
const key = (q, r) => q + ',' + r;
const IDX = new Map(CELLS.map((c, i) => [key(c.q, c.r), i]));
const px = (c) => ({ x: SIZE * SQ3 * (c.q + c.r / 2), y: SIZE * 1.5 * c.r });

const xs = CELLS.map(c => px(c).x), ys = CELLS.map(c => px(c).y);
const minX = Math.min(...xs), minY = Math.min(...ys);
const BW = Math.max(...xs) - minX + CS, BH = Math.max(...ys) - minY + CS;
const pos = (c) => { const p = px(c); return { left: p.x - minX + CS / 2, top: p.y - minY + CS / 2 }; };

const board = document.getElementById('board');
board.style.setProperty('--bw', BW + 'px');
board.style.setProperty('--bh', BH + 'px');
board.style.setProperty('--cs', CS + 'px');

// La clip-path place ses sommets hauts et bas à 6,7 % et 93,3 % de la boîte :
// elle encode donc déjà le facteur √3/2 d'un hexagone régulier. Son conteneur
// doit par conséquent être CARRÉ. L'hexagone réellement dessiné mesure alors
// slabW de large et 0,866·slabW de haut.
const slabW = (Math.max(...xs) - minX) + CS * 1.62;
const slabH = slabW;
// Garde-fou : la hauteur utile doit contenir l'étendue verticale des cases.
console.assert((Math.max(...ys) - minY) + CS <= slabW * SQ3 / 2, 'plateau trop court');
board.style.setProperty('--slabw', slabW + 'px');
board.style.setProperty('--slabh', slabH + 'px');

// Roles de cases : estimation a confirmer sur le plateau physique.
const CROWN = [IDX.get(key(0, 3)), IDX.get(key(0, -3))];
const onEdge = (c) => Math.max(Math.abs(c.q), Math.abs(c.r), Math.abs(c.q + c.r)) === R;
const RECRUIT = CELLS
  .map((c, i) => ({ c, i }))
  .filter(o => onEdge(o.c) && !CROWN.includes(o.i) && (o.c.r >= 2 || o.c.r <= -2))
  .map(o => o.i);

// Silhouettes originales, construites en code. viewBox 0 0 100 80, posees au sol.
const F = {
  leader: (a, b) =>
    '<path d="M30 14l6 11 6-15 8 15 6-15 6 15 6-11 2 21H28z" fill="#c9a227"/>' +
    '<circle cx="50" cy="26" r="7.5" fill="#f3dfc6"/>' +
    '<path d="M38 33h24l11 45q-23 10-46 0z" fill="' + a + '"/>' +
    '<path d="M45 38h10l5 39q-10 4-20 0z" fill="' + b + '" opacity=".6"/>',
  rodeuse: (a, b) =>
    '<path d="M50 24c-15-7-28 1-33 14 9-5 18-4 25 2z" fill="' + b + '"/>' +
    '<path d="M50 24c15-7 28 1 33 14-9-5-18-4-25 2z" fill="' + b + '"/>' +
    '<path d="M50 18a9 9 0 019 9v7l-9 44-9-44v-7a9 9 0 019-9z" fill="' + a + '"/>' +
    '<circle cx="46" cy="27" r="2.2" fill="#fff"/><circle cx="54" cy="27" r="2.2" fill="#fff"/>',
  cogneur: (a, b) =>
    '<path d="M33 24q-11-11-17-4 4 9 13 13z" fill="#ece0c4"/>' +
    '<path d="M67 24q11-11 17-4-4 9-13 13z" fill="#ece0c4"/>' +
    '<path d="M50 18c12 0 19 8 19 17s-8 12-19 12-19-3-19-12 7-17 19-17z" fill="' + a + '"/>' +
    '<circle cx="43" cy="32" r="2.5" fill="#fff"/><circle cx="57" cy="32" r="2.5" fill="#fff"/>' +
    '<path d="M30 47h40l7 31q-27 10-54 0z" fill="' + b + '"/>',
  archere: (a, b) =>
    '<path d="M74 16q14 25 0 54" stroke="' + b + '" stroke-width="4.5" fill="none" stroke-linecap="round"/>' +
    '<path d="M74 16L74 70" stroke="#efe3c8" stroke-width="1.6"/>' +
    '<path d="M32 43h44" stroke="#efe3c8" stroke-width="2.6"/>' +
    '<circle cx="47" cy="25" r="8" fill="#f3dfc6"/>' +
    '<path d="M39 33h17l8 45q-17 7-33 0z" fill="' + a + '"/>' +
    '<path d="M39 33h17l3 15H36z" fill="' + b + '"/>',
  acrobate: (a, b) =>
    '<circle cx="50" cy="22" r="9.5" fill="' + a + '"/>' +
    '<circle cx="46" cy="20" r="2.4" fill="#fff"/><circle cx="55" cy="20" r="2.4" fill="#fff"/>' +
    '<path d="M50 32c9 0 13 6 13 15l-4 31H41l-4-31c0-9 4-15 13-15z" fill="' + a + '"/>' +
    '<path d="M38 38q-15 6-19 21M62 38q15 6 19 21" stroke="' + b + '" stroke-width="5.5" fill="none" stroke-linecap="round"/>',
  assassin: (a, b) =>
    '<path d="M50 16c14 0 21 12 21 25l-4 37H33l-4-37c0-13 7-25 21-25z" fill="' + a + '"/>' +
    '<path d="M50 16c14 0 21 12 21 25l-2 15H31l-2-15c0-13 7-25 21-25z" fill="' + b + '" opacity=".45"/>' +
    '<circle cx="44" cy="33" r="2.8" fill="#ff5e8a"/><circle cx="56" cy="33" r="2.8" fill="#ff5e8a"/>' +
    '<path d="M74 32l6 46" stroke="#c9a227" stroke-width="3.6" stroke-linecap="round"/>',
};
const svg = (kind, a, b) =>
  '<svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMax meet">' + F[kind](a, b) + '</svg>';

for (let i = 0; i < CELLS.length; i++) {
  const c = CELLS[i];
  const d = document.createElement('div');
  d.className = 'cell' + (CROWN.includes(i) ? ' crown' : '') + (RECRUIT.includes(i) ? ' recruit' : '');
  const p = pos(c);
  d.style.left = p.left + 'px';
  d.style.top = p.top + 'px';
  d.innerHTML = '<div class="disc"></div>';
  d.dataset.i = String(i);
  board.appendChild(d);
}

const UNITS = [
  { kind: 'leader',   a: '#8e5bd4', b: '#d4b3f5', seat: 0, at: key(0, 3) },
  { kind: 'archere',  a: '#2f8f8a', b: '#7ad6cf', seat: 0, at: key(-1, 3) },
  { kind: 'acrobate', a: '#2c6fb5', b: '#8ec5f0', seat: 0, at: key(1, 2) },
  { kind: 'leader',   a: '#c23b5c', b: '#f2a0b4', seat: 1, at: key(0, -3) },
  { kind: 'cogneur',  a: '#a0582c', b: '#d79a63', seat: 1, at: key(1, -3) },
  { kind: 'assassin', a: '#4a4a58', b: '#8d8da0', seat: 1, at: key(-1, -2) },
  { kind: 'rodeuse',  a: '#7b3fa0', b: '#c58ae0', seat: 1, at: key(2, -2) },
];

let selected = 0;
const nodes = UNITS.map((u) => {
  const el = document.createElement('div');
  el.className = 'piece';
  el.innerHTML =
    '<div class="shadow"></div><div class="socle ' + (u.seat ? 'p1' : '') + '"></div>' +
    '<div class="fig">' + svg(u.kind, u.a, u.b) + '</div>';
  const p = pos(CELLS[IDX.get(u.at)]);
  el.style.left = p.left + 'px';
  el.style.top = p.top + 'px';
  board.appendChild(el);
  return el;
});

const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
function highlight() {
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('lit'));
  const u = UNITS[selected], here = CELLS[IDX.get(u.at)];
  const occ = new Set(UNITS.map(x => IDX.get(x.at)));
  for (const d of DIRS) {
    const i = IDX.get(key(here.q + d[0], here.r + d[1]));
    if (i !== undefined && !occ.has(i)) {
      const el = document.querySelector('.cell[data-i="' + i + '"]');
      if (el) el.classList.add('lit');
    }
  }
}
board.addEventListener('click', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell || !cell.classList.contains('lit')) return;
  const i = Number(cell.dataset.i), u = UNITS[selected];
  u.at = key(CELLS[i].q, CELLS[i].r);
  const p = pos(CELLS[i]);
  nodes[selected].style.left = p.left + 'px';
  nodes[selected].style.top = p.top + 'px';
  selected = (selected + 1) % UNITS.length;
  highlight();
});

document.getElementById('bFlat').addEventListener('click', () => document.body.classList.toggle('flat'));
document.querySelectorAll('[data-tilt]').forEach(b => b.addEventListener('click', () => {
  document.documentElement.style.setProperty('--tilt', b.dataset.tilt + 'deg');
  document.body.classList.remove('flat');
}));
highlight();
</script>
</body>
</html>
