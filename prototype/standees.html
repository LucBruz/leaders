<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaders — plateau et déplacement des figurines</title>
<style>
  :root{ --tilt:52deg; --lift:78px; --bone:#efe7d6; --gold:#c9a227; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:radial-gradient(ellipse at 50% 16%, #2c3340, #15181e 72%);
    font-family:ui-sans-serif,system-ui,sans-serif; color:#e8e3d9; padding:26px 16px;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
  h1{font-size:13px;letter-spacing:.22em;text-transform:uppercase;opacity:.5;font-weight:600;margin:0}
  .hint{font-size:13px;opacity:.5;margin:0;text-align:center;max-width:54ch;line-height:1.55}

  .scene{ perspective:1500px; perspective-origin:50% 42%; }
  .board{
    position:relative; width:var(--bw); height:var(--bh);
    transform:rotateX(var(--tilt)); transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.4,0,.2,1);
  }

  /* Hexagone régulier : la clip-path encode déjà le facteur √3/2,
     son conteneur doit donc être carré. */
  .slab{
    position:absolute; left:50%; top:50%;
    width:var(--slab); height:var(--slab);
    margin-left:calc(var(--slab) / -2); margin-top:calc(var(--slab) / -2);
    background:radial-gradient(ellipse at 38% 28%, #fdfaf3 0%, var(--bone) 45%, #ded2b8 100%);
    clip-path:polygon(100% 50%,75% 93.3%,25% 93.3%,0 50%,25% 6.7%,75% 6.7%);
    box-shadow:0 40px 70px -18px rgba(0,0,0,.8);
  }
  .slab::after{
    content:""; position:absolute; inset:14px;
    clip-path:polygon(100% 50%,75% 93.3%,25% 93.3%,0 50%,25% 6.7%,75% 6.7%);
    border:1px solid rgba(120,100,60,.26);
    background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(170,145,100,.07));
  }

  .cell,.shadow,.piece{
    position:absolute; left:0; top:0;
    width:var(--cs); height:var(--cs);
    margin-left:calc(var(--cs) / -2); margin-top:calc(var(--cs) / -2);
  }
  .cell{border-radius:50%}
  .disc{
    position:absolute; inset:0; border-radius:50%; cursor:pointer;
    background:radial-gradient(circle at 42% 36%, rgba(255,255,255,.55), rgba(190,172,136,.16) 70%, rgba(150,130,95,.24));
    box-shadow:inset 0 2px 4px rgba(120,100,70,.28), inset 0 -1px 2px rgba(255,255,255,.5);
    border:1px solid rgba(140,118,78,.28);
  }
  .cell.recruit .disc{
    border:1.5px solid var(--gold);
    box-shadow:inset 0 0 0 3px rgba(201,162,39,.15), inset 0 2px 5px rgba(120,100,70,.28);
  }
  .cell.crown .disc{
    border:2px solid var(--gold);
    background:radial-gradient(circle at 42% 36%, #fff8e2, #e8d6a4 70%, #d4bd82);
  }
  .cell.lit .disc{
    background:radial-gradient(circle at 42% 36%, #d9f1d3, #9cd49a 75%);
    border-color:#5fa75d;
    box-shadow:inset 0 0 0 3px rgba(95,167,93,.3), 0 0 14px rgba(120,210,120,.45);
  }

  /* L'ombre vit dans le plan du plateau et n'est JAMAIS enfant de la pièce :
     c'est ce qui permet à la figurine de s'en détacher en s'élevant. */
  .shadow{
    border-radius:50%; background:rgba(58,44,24,.45);
    filter:blur(5px); pointer-events:none;
  }

  .piece{ transform-style:preserve-3d; pointer-events:none; }
  .socle{
    position:absolute; left:5%; top:16%; width:90%; height:68%;
    border-radius:50%;
    background:linear-gradient(160deg,#f4e3b8,#d9bf86 55%,#bda268);
    border:1px solid rgba(120,95,45,.45);
    box-shadow:0 2px 0 #a98d55;
  }
  .socle.p1{
    background:linear-gradient(160deg,#f6d9d9,#d99a9a 55%,#bd7676);
    border-color:rgba(130,60,60,.5); box-shadow:0 2px 0 #a86060;
  }
  /* La silhouette se redresse par contre-rotation exacte de l'inclinaison.
     Pas de filter ici : drop-shadow aplatit le contexte 3D sur certains
     navigateurs, et l'ombre est de toute façon un élément à part. */
  .fig{
    position:absolute; left:50%; bottom:40%;
    width:calc(var(--cs) * 1.34); height:calc(var(--cs) * 1.98);
    margin-left:calc(var(--cs) * -.67);
    transform:rotateX(calc(var(--tilt) * -1));
    transform-origin:50% 100%;
    transition:transform .6s cubic-bezier(.4,0,.2,1);
  }
  .fig img{width:100%;height:100%;display:block;object-fit:contain;object-position:bottom}

  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{
    background:rgba(255,255,255,.07); color:#e8e3d9; border:1px solid rgba(255,255,255,.18);
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  button:hover{background:rgba(255,255,255,.14)}
  label{font-size:12px;opacity:.55;display:flex;gap:8px;align-items:center}
  input[type=range]{width:120px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Leaders &mdash; d&eacute;placement des figurines</h1>
  <div class="scene"><div class="board" id="board"><div class="slab"></div></div></div>
  <p class="hint">Clique une case verte : la figurine active se <b>l&egrave;ve</b>, se d&eacute;place en l'air, puis se <b>repose</b>. L'ombre reste au sol, s'&eacute;tale et s'adoucit pendant la lev&eacute;e.</p>
  <div class="controls">
    <button data-tilt="34">Inclinaison douce</button>
    <button data-tilt="52">Standard</button>
    <button data-tilt="66">Forte</button>
    <label>Hauteur <input type="range" id="lift" min="0" max="140" value="78"></label>
    <label>Dur&eacute;e <input type="range" id="speed" min="40" max="200" value="100"></label>
  </div>
</div>

<script type="module">
const R = 3, SIZE = 46, CS = 56, SQ3 = Math.sqrt(3);

// ── Grille axiale, identique à engine/board.ts ──────────────────────────
const CELLS = [];
for (let q = -R; q <= R; q++) {
  const rMin = Math.max(-R, -q - R), rMax = Math.min(R, -q + R);
  for (let r = rMin; r <= rMax; r++) CELLS.push({ q, r });
}
const key = (q, r) => q + ',' + r;
const IDX = new Map(CELLS.map((c, i) => [key(c.q, c.r), i]));
const px = (c) => ({ x: SIZE * SQ3 * (c.q + c.r / 2), y: SIZE * 1.5 * c.r });

const xs = CELLS.map(c => px(c).x), ys = CELLS.map(c => px(c).y);
const minX = Math.min(...xs), minY = Math.min(...ys);
const BW = Math.max(...xs) - minX + CS, BH = Math.max(...ys) - minY + CS;
const pos = (i) => { const p = px(CELLS[i]); return { x: p.x - minX + CS / 2, y: p.y - minY + CS / 2 }; };

const board = document.getElementById('board');
const slab = (Math.max(...xs) - minX) + CS * 1.62;
console.assert((Math.max(...ys) - minY) + CS <= slab * SQ3 / 2, 'plateau trop court');
board.style.setProperty('--bw', BW + 'px');
board.style.setProperty('--bh', BH + 'px');
board.style.setProperty('--cs', CS + 'px');
board.style.setProperty('--slab', slab + 'px');

// Rôles de cases : estimation, à confirmer sur le plateau physique.
const CROWN = [IDX.get(key(0, R)), IDX.get(key(0, -R))];
const onEdge = (c) => Math.max(Math.abs(c.q), Math.abs(c.r), Math.abs(c.q + c.r)) === R;
const RECRUIT = CELLS.map((c, i) => ({ c, i }))
  .filter(o => onEdge(o.c) && !CROWN.includes(o.i) && Math.abs(o.c.r) >= 2)
  .map(o => o.i);

for (let i = 0; i < CELLS.length; i++) {
  const d = document.createElement('div');
  d.className = 'cell' + (CROWN.includes(i) ? ' crown' : '') + (RECRUIT.includes(i) ? ' recruit' : '');
  const p = pos(i);
  d.style.transform = `translate3d(${p.x}px, ${p.y}px, 0)`;
  d.dataset.i = String(i);
  d.innerHTML = '<div class="disc"></div>';
  board.appendChild(d);
}

// ── Figurines ───────────────────────────────────────────────────────────
const UNITS = [
  { id: 'leader',       seat: 0, at: IDX.get(key(0, R)) },
  { id: 'archere',      seat: 0, at: IDX.get(key(-1, R)) },
  { id: 'gardeRoyal',   seat: 0, at: IDX.get(key(1, R - 1)) },
  { id: 'vieilOurs',    seat: 0, at: IDX.get(key(-2, R)) },
  { id: 'leader',       seat: 1, at: IDX.get(key(0, -R)) },
  { id: 'cogneur',      seat: 1, at: IDX.get(key(1, -R)) },
  { id: 'rodeuse',      seat: 1, at: IDX.get(key(-1, -R + 1)) },
  { id: 'assassin',     seat: 1, at: IDX.get(key(2, -R)) },
];

// Le Leader a une variante par siège : sa couleur de socle ne suffit pas à
// distinguer les deux camps d'un coup d'œil, et c'est la pièce dont la
// lecture compte le plus.
const art = (u) => (u.id === 'leader' && u.seat === 1 ? 'leader-p1' : u.id);

const shadows = [], pieces = [];
for (const u of UNITS) {
  const sh = document.createElement('div');
  sh.className = 'shadow';
  board.appendChild(sh);
  shadows.push(sh);

  const el = document.createElement('div');
  el.className = 'piece';
  el.innerHTML =
    `<div class="socle ${u.seat ? 'p1' : ''}"></div>` +
    `<div class="fig"><img src="/characters/${art(u)}.svg" alt="${u.id}"></div>`;
  board.appendChild(el);
  pieces.push(el);
}

const SHADOW_FLAT = 'blur(5px)';
function placeAt(n, cell) {
  const p = pos(cell);
  pieces[n].style.transform = `translate3d(${p.x}px, ${p.y}px, 0)`;
  shadows[n].style.transform = `translate3d(${p.x}px, ${p.y}px, 0) scale(1)`;
  shadows[n].style.opacity = '.45';
  shadows[n].style.filter = SHADOW_FLAT;
}
UNITS.forEach((u, n) => placeAt(n, u.at));

// ── Lever / déplacer / reposer ──────────────────────────────────────────
// Le plateau est un plan incliné en 3D : translateZ sur une pièce la sort donc
// réellement de ce plan, perpendiculairement à la table. Ce n'est pas un
// glissement 2D déguisé. L'ombre, elle, reste à z = 0 et se contente de
// s'étaler et de pâlir — c'est ce décrochage qui donne la hauteur.

let speed = 1;
const lift = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lift'));

function hop(n, to) {
  const a = pos(UNITS[n].at), b = pos(to), h = lift();
  const d = 760 * speed;
  const ease = 'cubic-bezier(.33,0,.2,1)';

  pieces[n].animate([
    { transform: `translate3d(${a.x}px, ${a.y}px, 0)`,    offset: 0,    easing: 'cubic-bezier(.3,0,.3,1)' },
    { transform: `translate3d(${a.x}px, ${a.y}px, ${h}px)`, offset: .26, easing: 'cubic-bezier(.4,0,.6,1)' },
    { transform: `translate3d(${b.x}px, ${b.y}px, ${h}px)`, offset: .70, easing: 'cubic-bezier(.5,0,.4,1)' },
    // Léger enfoncement à l'atterrissage, puis stabilisation.
    { transform: `translate3d(${b.x}px, ${b.y}px, -3px)`,  offset: .90, easing: 'cubic-bezier(.3,0,.2,1)' },
    { transform: `translate3d(${b.x}px, ${b.y}px, 0)`,     offset: 1 },
  ], { duration: d, fill: 'forwards' });

  // L'ombre suit en plan, grandit et se dilue à mesure que la pièce monte.
  shadows[n].animate([
    { transform: `translate3d(${a.x}px, ${a.y}px, 0) scale(1)`,    opacity: .45, filter: SHADOW_FLAT, offset: 0 },
    { transform: `translate3d(${a.x}px, ${a.y}px, 0) scale(1.5)`,  opacity: .15, filter: 'blur(13px)', offset: .26 },
    { transform: `translate3d(${b.x}px, ${b.y}px, 0) scale(1.5)`,  opacity: .15, filter: 'blur(13px)', offset: .70 },
    { transform: `translate3d(${b.x}px, ${b.y}px, 0) scale(1)`,    opacity: .45, filter: SHADOW_FLAT, offset: 1 },
  ], { duration: d, easing: ease, fill: 'forwards' });

  // La silhouette s'incline comme un objet qu'on soulève et qu'on repose.
  const fig = pieces[n].querySelector('.fig');
  const up = `rotateX(calc(var(--tilt) * -1))`;
  fig.animate([
    { transform: `${up} rotateZ(0deg) scaleY(1)`,       offset: 0 },
    { transform: `${up} rotateZ(-5deg) scaleY(1.05)`,   offset: .26 },
    { transform: `${up} rotateZ(4deg) scaleY(1.05)`,    offset: .70 },
    { transform: `${up} rotateZ(0deg) scaleY(.92)`,     offset: .90 },
    { transform: `${up} rotateZ(0deg) scaleY(1)`,       offset: 1 },
  ], { duration: d, easing: ease, fill: 'forwards' });

  UNITS[n].at = to;
}

// ── Interaction ─────────────────────────────────────────────────────────
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
let selected = 0, busy = false;

function highlight() {
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('lit'));
  const here = CELLS[UNITS[selected].at];
  const occupied = new Set(UNITS.map(u => u.at));
  for (const [dq, dr] of DIRS) {
    const i = IDX.get(key(here.q + dq, here.r + dr));
    if (i !== undefined && !occupied.has(i)) {
      board.querySelector(`.cell[data-i="${i}"]`)?.classList.add('lit');
    }
  }
}

board.addEventListener('click', (e) => {
  if (busy) return;
  const cell = e.target.closest('.cell');
  if (!cell || !cell.classList.contains('lit')) return;
  busy = true;
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('lit'));
  hop(selected, Number(cell.dataset.i));
  setTimeout(() => {
    busy = false;
    selected = (selected + 1) % UNITS.length;
    highlight();
  }, 760 * speed);
});

document.querySelectorAll('[data-tilt]').forEach(b => b.addEventListener('click', () => {
  document.documentElement.style.setProperty('--tilt', b.dataset.tilt + 'deg');
}));
document.getElementById('lift').addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--lift', e.target.value + 'px');
});
document.getElementById('speed').addEventListener('input', (e) => {
  speed = Number(e.target.value) / 100;
});

highlight();
</script>
</body>
</html>
